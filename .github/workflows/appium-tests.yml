name: Appium Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest
    
    strategy:
      matrix:
        ios-version: ['18.6']
        device: ['iPhone 16 Pro']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        pwd
        npm ci
        
    - name: Install Appium
      run: |
        npm install -g appium
        npm install -g appium-doctor
        
    - name: Check Appium installation
      run: |
        appium --version
        appium-doctor
        
    - name: Setup iOS Simulator
      run: |
        # List available simulators
        xcrun simctl list devices
        
        # Create and boot simulator
        xcrun simctl create "iPhone 16" "iPhone 16 Pro" "iOS18.6"
        xcrun simctl boot "iPhone 16 Pro"
        
        # Wait for simulator to be ready
        xcrun simctl status_bar "iPhone 16 Pro" override --time "9:41" --batteryLevel 100 --cellularBars 4
        
    - name: Build iOS App
      run: |
        
        xcodebuild -project ToDoList.xcodeproj \
                   -scheme ToDoList \
                   -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6' \
                   -derivedDataPath build \
                   build
                   
    - name: Update Appium config
      run: |
        
        # Update appium.config.js with built app path
        sed -i '' 's|/Users/shinlee/Library/Developer/Xcode/DerivedData/ToDoList-fedlpydtrbrwzgcxfjummcutwynt/Build/Products/ToDoList.app|./build/Build/Products/Debug-iphonesimulator/ToDoList.app|g' appium.config.js
        sed -i '' 's|iPhone 16 Plus|iPhone 16 Pro|g' appium.config.js
        sed -i '' 's|17\.0|18.6|g' appium.config.js
        
    - name: Start Appium Server
      run: |
        # cd Swift-ToDoList-App
        appium --base-path / --log appium.log &
        sleep 10
        
    - name: Run Appium Tests
      run: |
        # cd Swift-ToDoList-App
        mkdir -p screenshots
        npm test
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          screenshots/
          *.log
          appium.log
        
    - name: Upload app build
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-app
        path: ./build/Build/Products/Debug-iphonesimulator/ToDoList.app
        
    - name: Cleanup
      if: always()
      run: |
        # Stop Appium
        pkill -f appium || true
        
        # Shutdown simulator
        xcrun simctl shutdown "iPhone 16 Pro" || true
        xcrun simctl delete "iPhone 16 Pro" || true
