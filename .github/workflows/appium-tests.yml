name: Appium Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest
    
    strategy:
      matrix:
        ios-version: ['17.0']
        device: ['iPhone 15 Pro']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        pwd
        npm ci
        
    - name: Install Appium
      run: |
        npm install -g appium
        npm install -g appium-doctor
        
    - name: Check Appium installation
      run: |
        appium --version
        appium-doctor
        
    - name: Setup iOS Simulator
      run: |
        # List available simulators
        xcrun simctl list devices
        
        # Create and boot simulator
        xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" "iOS17.0"
        xcrun simctl boot "iPhone 15 Pro"
        
        # Wait for simulator to be ready
        xcrun simctl status_bar "iPhone 15 Pro" override --time "9:41" --batteryLevel 100 --cellularBars 4
        
    - name: Build iOS App
      run: |
        cd Swift-ToDoList-App
        xcodebuild -project ToDoList.xcodeproj \
                   -scheme ToDoList \
                   -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0' \
                   -derivedDataPath build \
                   build
                   
    - name: Update Appium config
      run: |
        cd Swift-ToDoList-App
        # Update appium.config.js with built app path
        sed -i '' 's|\./ToDoList\.ipa|./build/Build/Products/Debug-iphonesimulator/ToDoList.app|g' appium.config.js
        sed -i '' 's|iPhone 15 Pro|iPhone 15 Pro|g' appium.config.js
        sed -i '' 's|17\.0|17.0|g' appium.config.js
        
    - name: Start Appium Server
      run: |
        cd Swift-ToDoList-App
        appium --base-path / --log appium.log &
        sleep 10
        
    - name: Run Appium Tests
      run: |
        cd Swift-ToDoList-App
        npm test
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          Swift-ToDoList-App/screenshots/
          Swift-ToDoList-App/*.log
          Swift-ToDoList-App/appium.log
        
    - name: Upload app build
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-app
        path: Swift-ToDoList-App/build/Build/Products/Debug-iphonesimulator/ToDoList.app
        
    - name: Cleanup
      if: always()
      run: |
        # Stop Appium
        pkill -f appium || true
        
        # Shutdown simulator
        xcrun simctl shutdown "iPhone 15 Pro" || true
        xcrun simctl delete "iPhone 15 Pro" || true
